name: Update Elections Calendar

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.dowjones.net/SenescalK/global-elections-calendar-1.git" .

      - name: Install dependencies
        run: pip3 install -r requirements.txt

      - name: Run scraper
        run: python3 scraper.py

      - name: Commit updated elections.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add elections.json
          git diff --cached --quiet || git commit -m "chore: update elections.json [$(date -u '+%Y-%m-%d')]"
          git push
