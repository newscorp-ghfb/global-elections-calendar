[importlinter]
root_packages =
    elections_calendar

# Spec §4, top to bottom. A module may import only from layers below it;
# "|" separates modules of one layer, which may not import each other.
[importlinter:contract:layers]
name = Pipeline layers (spec §4)
type = layers
containers =
    elections_calendar
layers =
    __main__
    pipeline
    feed | publish | validate
    merge
    health | snapshots
    ledger | runner
    sources
    fetch | dates | places | offices | window
    model | text

[importlinter:contract:adapters]
name = Adapters are independent (spec §4)
type = independence
modules =
    elections_calendar.sources.electionguide
    elections_calendar.sources.osce
    elections_calendar.sources.wikipedia
    elections_calendar.sources.ndi
    elections_calendar.sources.aweb
    elections_calendar.sources.eisa
    elections_calendar.sources.ipu
    elections_calendar.sources.carter
    elections_calendar.sources.eeas
