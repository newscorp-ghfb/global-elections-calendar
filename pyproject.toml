[project]
name = "elections-calendar"
version = "2.0.0"
description = "Global Elections Calendar: daily scraper, feed and Chrome extension"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["elections_calendar", "scripts", "tests", "scraper.py"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".scratch", ".claude", "./extension", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests quote long real-world source strings verbatim.
"tests/**" = ["E501"]
